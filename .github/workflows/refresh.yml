name: Refresh prices

# Free on GitHub: scheduled runs + Pages hosting need no paid plan for public repos.
on:
  schedule:
    # Every 2 hours, offset off the hour to be kind to the source.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

permissions:
  contents: write            # commit the new snapshot (history)
  pages: write               # publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh snapshot from ForeverEcon
        run: python scripts/refresh.py

      - name: Build the shareable single-file copy
        run: python scripts/build_single.py

      - name: Commit the new snapshot
        continue-on-error: true      # never block the deploy on a protected branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js data/latest.json data/history.jsonl dist/
          if git diff --cached --quiet; then
            echo "No price change since last run."
          else
            git commit -m "chore: refresh prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/assets
          cp dist/guild-fishing-board.html _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
